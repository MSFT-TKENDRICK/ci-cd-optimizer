# CI/CD Optimizer configuration for this repository (dogfooding).
# Schema: docs/configuration.md. Validate locally: npm run cli -- lint .
schemaVersion: 1
extends: [recommended, agentic, github]
ignorePaths:
  - node_modules/**
  - dist/**
  - dist-action/**
  - coverage/**
  # Generated by `gh aw compile`; edit the .md source instead.
  - .github/workflows/*.lock.yml
  # Benchmark fixtures deliberately contain anti-patterns.
  - corpus/**
  - examples/**
  - test/**
failOn: error

issues:
  enabled: true
  minSeverity: warn
  minImpact: medium
  groupBy: rule
  labels: [ci-cd-optimizer]
  maxOpen: 10
  closeResolved: true
  assignCopilot: true
  copilot:
    customInstructions: Keep changes minimal, run npm test and npm run lint, and dogfood with `npm run cli -- lint .`.

fixes:
  enabled: true
  openPullRequestsLimit: 5
  labels: [ci-cd-optimizer, dependencies]
  groups:
    actions:
      rulesets: [workflow]

alerts:
  enabled: true
  branches: [main]
  labels: [ci-cd-optimizer, performance-regression]
  assignCopilot: false

recipes:
  enabled: true
  maxRisk: medium
  labels: [ci-cd-optimizer, recipe]
