# Trusted half of project review intake (docs/review-program/README.md). Branch protection requires the commit status
# this job publishes, review-intake/trusted, not the Review intake pull_request job: a pull request can rewrite that
# workflow, so its result proves nothing.
#
# Runs from the default branch with a pull-requests: write and statuses: write token and never checks out, builds, or
# executes pull request code. The only input taken from the unprivileged run is a tiny {"pr_number","head_sha"} record.
# It is size-capped, strictly parsed and must name the commit this event reports. It only chooses the path taken
# below; it can never make a submission pass:
#   - record present: the trusted CLI repeats intake itself through the API for the pull request it names;
#   - record missing or invalid: any open pull request at this commit that touches projects/ fails closed.
# Every open pull request whose head is this commit is evaluated, and the status succeeds only if all of them pass.
# Dependencies come from the default-branch npm cache scope only; caches written by pull request runs are scoped to
# their refs/pull/* ref and are not visible here.
name: Review intake comment

on:
  workflow_run:
    workflows: [Review intake]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: review-intake-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    # A skipped or failed intake run still gets a verdict (it fails closed below). Runs that were cancelled or still
    # await approval for a fork are left alone: their completed rerun triggers this workflow again.
    if: >-
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion != 'cancelled' &&
       github.event.workflow_run.conclusion != 'action_required') ||
      (github.event.workflow_run.event == 'merge_group' &&
       github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
      # Merge groups are built from pull requests that already carry a successful trusted status.
      - name: Pass merge group
        if: github.event.workflow_run.event == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api --method POST "repos/$REPO/statuses/$EXPECTED_SHA" -f state=success \
            -f context=review-intake/trusted -f description="Merge group of reviewed pull requests." > /dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.workflow_run.event == 'pull_request'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - if: github.event.workflow_run.event == 'pull_request'
        uses: ./.github/actions/setup

      - name: Validate intake record
        id: record
        if: github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          size="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "review-intake" and .expired == false)] | if length == 0 then "none" elif length == 1 then .[0].size_in_bytes else "many" end')"
          if [ "$size" = "none" ]; then
            echo "::warning::The intake run left no record; submissions at this commit fail closed."
            echo "record=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$size" =~ ^[0-9]+$ ]] || [ "$size" -gt 4096 ]; then
            echo "::warning::Refusing the intake record artifact (size: $size); submissions at this commit fail closed."
            echo "record=invalid" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dir="$RUNNER_TEMP/intake-record"
          parsed="$RUNNER_TEMP/intake-record.out"
          if gh run download "$RUN_ID" --repo "$REPO" --name review-intake --dir "$dir" &&
            npm run --silent cli -- review intake-artifact "$dir/intake.json" --expected-sha "$EXPECTED_SHA" > "$parsed"; then
            cat "$parsed" >> "$GITHUB_OUTPUT"
            echo "record=present" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The intake record is invalid; submissions at this commit fail closed."
            echo "record=invalid" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish trusted intake status
        if: github.event.workflow_run.event == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          RECORD: ${{ steps.record.outputs.record }}
          PR_NUMBER: ${{ steps.record.outputs.pr_number }}
        run: |
          pr_args=()
          if [ "$RECORD" = "present" ]; then pr_args=(--pr "$PR_NUMBER"); fi
          status=0
          npm run --silent cli -- review intake-status --head-sha "$EXPECTED_SHA" "${pr_args[@]}" \
            --record "${RECORD:-invalid}" --comment --status --output "$GITHUB_STEP_SUMMARY" || status=$?
          # Exit code 1 is a failing verdict that the status and comment already report; anything else is an error.
          if [ "$status" -gt 1 ]; then exit "$status"; fi

      - name: Report intake error
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api --method POST "repos/$REPO/statuses/$EXPECTED_SHA" -f state=error \
            -f context=review-intake/trusted -f description="Trusted intake failed; a maintainer must re-run it." > /dev/null