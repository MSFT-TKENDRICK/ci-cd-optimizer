# Dependabot-style scan without installing the GitHub App: lints the default branch through the API, uploads
# SARIF to code scanning, and syncs finding issues and autofix pull requests per .github/ci-cd-optimizer.yml.
# Runs daily through cicd-optimizer-daily.yml, after pushes to main that change CI files, and on manual dispatch.
#
# Tokens (all optional):
#   vars.CICD_OPTIMIZER_APP_ID + secrets.CICD_OPTIMIZER_APP_PRIVATE_KEY  GitHub App installation token. Pull requests
#       it opens trigger CI, and it may change .github/workflows/* (GITHUB_TOKEN can do neither).
#   secrets.CICD_OPTIMIZER_TOKEN   Fine-grained PAT alternative to the App.
#   secrets.COPILOT_ASSIGN_TOKEN   A Copilot-licensed user's token; assigns finding issues to the Copilot coding agent.
name: CI/CD Optimizer scan

on:
  # A caller must grant the scan job's permissions and pass these secrets explicitly.
  workflow_call:
    secrets:
      CICD_OPTIMIZER_APP_PRIVATE_KEY:
        description: GitHub App private key, used with vars.CICD_OPTIMIZER_APP_ID.
        required: false
      CICD_OPTIMIZER_TOKEN:
        description: Fine-grained PAT alternative to the App.
        required: false
      COPILOT_ASSIGN_TOKEN:
        description: A Copilot-licensed user's token for assigning finding issues to the Copilot coding agent.
        required: false
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "**/Dockerfile*"
      - "**/*.dockerfile"
      - "**/package.json"
      - "**/build.gradle*"
      - "**/pom.xml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-optimizer-scan
  cancel-in-progress: false
  queue: max

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      security-events: write
    steps:
      - name: Mint GitHub App token
        id: app-token
        if: vars.CICD_OPTIMIZER_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CICD_OPTIMIZER_APP_ID }}
          private-key: ${{ secrets.CICD_OPTIMIZER_APP_PRIVATE_KEY }}

      # The scan reads the repository through the API; only the action itself is needed on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            dist-action

      - name: Scan
        uses: ./
        env:
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        with:
          command: scan
          args: --upload-sarif
          token: ${{ steps.app-token.outputs.token || secrets.CICD_OPTIMIZER_TOKEN || github.token }}
