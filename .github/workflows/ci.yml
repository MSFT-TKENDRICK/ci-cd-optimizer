name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  # Experiments dispatch repeated runs on arm branches to collect duration samples (docs/experiments.md).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Independent jobs run in parallel so the slowest check (typed ESLint) bounds wall-clock time.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm test

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run lint

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lockfile resolves from the public npm registry
        # A lockfile written through a private mirror breaks Dependabot, which can't authenticate to it.
        run: |
          if grep -nE '"resolved": "https?://' package-lock.json | grep -v '"https://registry.npmjs.org/'; then
            echo "::error file=package-lock.json::Rewrite these resolved URLs to https://registry.npmjs.org/ (docs/setup.md)."
            exit 1
          fi
      - uses: ./.github/actions/setup
      - run: npm run build
      - name: Action bundle is up to date
        run: |
          npm run bundle
          git diff --exit-code --stat -- dist-action || { echo "::error::dist-action is stale; run npm run bundle and commit it."; exit 1; }
      - name: Dogfood the linter on this repository
        uses: ./
        with:
          command: lint
          args: --format github --fail-on error
