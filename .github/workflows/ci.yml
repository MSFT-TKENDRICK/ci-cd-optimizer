name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  # Experiments dispatch repeated runs on arm branches to collect duration samples (docs/experiments.md).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Independent checks run in parallel; the longest job determines the critical path.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm test

  postgres:
    # The hosted App's telemetry store, against a real server; skipped by `npm test` when DATABASE_URL is unset.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npx vitest run test/telemetry/postgres-store.test.ts test/knowledge/postgres-store.test.ts test/webhooks/postgres-queue.test.ts test/service/webhooks.test.ts

  app:
    # Exercise the shipped image through its published port, not just service mocks.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SMOKE_DATABASE_CONTAINER: cicd-smoke-postgres-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Start PostgreSQL alongside image preparation
        id: postgres
        run: node test/service/container-postgres.mjs start
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # GitHub destroys hosted VMs after the job; retain cleanup on other runners.
          cleanup: ${{ runner.environment != 'github-hosted' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ci-cd-optimizer:smoke
          cache-from: type=gha,scope=ci-smoke
          cache-to: type=gha,mode=max,scope=ci-smoke
      - name: Direct and durable production image
        run: |
          node test/service/container-postgres.mjs ready
          node test/service/container-smoke-suite.mjs
        env:
          SMOKE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      - name: Remove disposable PostgreSQL
        if: ${{ always() && steps.postgres.outcome != 'skipped' }}
        run: |
          cat "$RUNNER_TEMP/$SMOKE_DATABASE_CONTAINER/start.log"
          node test/service/container-postgres.mjs cleanup

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run lint

  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Every built-in rule has an up-to-date explicit assurance entry
        run: npm run assurance:check
      - name: Install SHA-256-pinned Dafny and Z3
        run: npm run formal:setup
      - name: Verify all theorems and reproduce the committed executable kernel
        run: npm run formal:check
      - name: Exercise model adapters, immutable sources, adversarial certificates and production selection
        run: npx vitest run test/formal test/experiments/formal-integration.test.ts

  maf:
    # The Microsoft Agent Framework agent (docs/maf-agent.md): unit, benchmark-scoring and deploy-template checks.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agents/maf/requirements*.txt
            evals/feedback/requirements.txt
      - run: pip install -r agents/maf/requirements.txt -r agents/maf/requirements-dev.txt -r evals/feedback/requirements.txt
      - name: Agent, server, policy, benchmark scorers, climb engine and template contract
        run: python -m pytest -q
        working-directory: agents/maf
      - name: Behavior grading and skill evolution
        run: python -m pytest -q evals/feedback/test_behavior.py evals/feedback/test_evolve.py
        env:
          PYTHONPATH: agents/maf:evals/feedback
      # The template check needs only Node built-ins and the SHA-256-pinned Bicep CLI, not npm dependencies.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .agent-artifacts/tools
          key: bicep-${{ runner.os }}-${{ hashFiles('scripts/azure-template.mjs') }}
      - name: Deploy to Azure template matches main.bicep
        run: node scripts/azure-template.mjs --check

  maf-image:
    # Builds the agent image the Deploy to Azure template runs and checks it serves health and enforces auth.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: ${{ runner.environment != 'github-hosted' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: agents/maf/Dockerfile
          load: true
          push: false
          tags: cicd-maf-agent:smoke
          cache-from: type=gha,scope=maf-image
          cache-to: type=gha,mode=max,scope=maf-image
      - name: Healthy without a model call, and /chat rejects a missing bearer token
        run: |
          docker run -d --name maf-smoke -p 8000:8000 -e CICD_AGENT_API_KEY="$(openssl rand -hex 24)" cicd-maf-agent:smoke
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"message":"hi"}' http://127.0.0.1:8000/chat)
          test "$status" = 401 || { echo "expected 401 from /chat without a token, got $status"; exit 1; }
      - name: Container log
        if: always()
        run: docker logs maf-smoke || true

  lint-reusable:
    # Dogfoods the reusable linter workflow at this commit; callers pin `uses:` and `tool-ref` to a SHA.
    uses: ./.github/workflows/lint-reusable.yml
    permissions:
      contents: read
    with:
      tool-ref: ${{ github.sha }}

  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lockfile resolves from the public npm registry
        # A lockfile written through a private mirror breaks Dependabot, which can't authenticate to it.
        run: |
          if grep -nE '"resolved": "https?://' package-lock.json | grep -v '"https://registry.npmjs.org/'; then
            echo "::error file=package-lock.json::Rewrite these resolved URLs to https://registry.npmjs.org/ (docs/setup.md)."
            exit 1
          fi
      - uses: ./.github/actions/setup
      - run: npm run build
        id: source_build
      - name: Generate agent plugin bundle
        id: agent_bundle
        run: npm run bundle:agents
      - name: Generate Action bundle
        id: bundle
        if: ${{ !cancelled() && steps.source_build.outcome == 'success' }}
        run: npm run bundle
      - name: Packed agent bins and real stdio roundtrips
        id: agent_package_check
        if: ${{ !cancelled() && steps.agent_bundle.outcome == 'success' }}
        run: npm run test:agents:package
      - name: Execute the modeled planner and formal checker from the shipped Action bundle
        id: formal_bundle_check
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: npm run formal:check-bundle
      - name: Agent plugin bundle is up to date
        id: agent_bundle_check
        if: ${{ !cancelled() && steps.agent_bundle.outcome == 'success' }}
        run: |
          git diff --exit-code --stat -- plugins/ci-cd-optimizer/server || { echo "::error::Agent bundle is stale; reconcile the agent-bundle artifact generated by this CI run."; exit 1; }
      - name: Action bundle is up to date
        id: bundle_check
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          git diff --exit-code --stat -- dist-action || { echo "::error::dist-action is stale; reconcile the action-bundle artifact generated by this CI run."; exit 1; }
      - name: Upload generated agent bundle for reconciliation
        if: failure() && steps.agent_bundle.outcome == 'success' && (steps.agent_bundle_check.outcome == 'failure' || steps.agent_package_check.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-bundle-${{ github.sha }}
          path: plugins/ci-cd-optimizer/server/cicd-agents.mjs
          retention-days: 1
      - name: Upload generated bundle for reconciliation
        if: failure() && steps.bundle.outcome == 'success' && (steps.bundle_check.outcome == 'failure' || steps.formal_bundle_check.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: action-bundle-${{ github.sha }}
          path: dist-action/index.js
          retention-days: 1
      - name: Typecheck the setup UI
        run: npm run typecheck:ui
      - name: Setup UI bundle is up to date
        id: ui_check
        run: npm run check:ui
      - name: Regenerate setup UI for reconciliation
        id: ui_regenerate
        if: failure() && steps.ui_check.outcome == 'failure'
        run: npm run build:ui
      - name: Upload regenerated setup UI for reconciliation
        if: failure() && steps.ui_regenerate.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-ui-${{ github.sha }}
          path: dist-setup
          retention-days: 1
      - name: Dogfood the linter on this repository
        uses: ./
        with:
          command: lint
          args: --format github --fail-on error
