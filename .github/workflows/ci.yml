name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  # Experiments dispatch repeated runs on arm branches to collect duration samples (docs/experiments.md).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Independent jobs run in parallel so the slowest check (typed ESLint) bounds wall-clock time.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm test

  postgres:
    # The hosted App's telemetry store, against a real server; skipped by `npm test` when DATABASE_URL is unset.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npx vitest run test/telemetry/postgres-store.test.ts test/knowledge/postgres-store.test.ts test/webhooks/postgres-queue.test.ts test/service/webhooks.test.ts

  app:
    # Exercise the shipped image through its published port, not just service mocks.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build image
        # cicd-optimizer-disable-next-line caching/docker-layer-cache -- the cold build replaces buildx setup and cache export, relying on Dockerfile cache mounts
        run: docker build --tag ci-cd-optimizer:smoke .
        env:
          DOCKER_BUILDKIT: 1
      - run: node test/service/container-smoke.mjs
      - name: Durable production image
        run: node test/service/container-smoke.mjs
        env:
          SMOKE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
          SMOKE_DATABASE_CONTAINER: ${{ job.services.postgres.id }}

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run lint

  lint-reusable:
    # Dogfoods the reusable linter workflow at this commit; callers pin `uses:` and `tool-ref` to a SHA.
    uses: ./.github/workflows/lint-reusable.yml
    permissions:
      contents: read
    with:
      tool-ref: ${{ github.sha }}

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lockfile resolves from the public npm registry
        # A lockfile written through a private mirror breaks Dependabot, which can't authenticate to it.
        run: |
          if grep -nE '"resolved": "https?://' package-lock.json | grep -v '"https://registry.npmjs.org/'; then
            echo "::error file=package-lock.json::Rewrite these resolved URLs to https://registry.npmjs.org/ (docs/setup.md)."
            exit 1
          fi
      - uses: ./.github/actions/setup
      - run: npm run build
      - name: Generate Action bundle
        id: bundle
        run: npm run bundle
      - name: Action bundle is up to date
        id: bundle_check
        run: |
          git diff --exit-code --stat -- dist-action || { echo "::error::dist-action is stale; run npm run bundle and commit it."; exit 1; }
      - name: Upload generated bundle for reconciliation
        if: failure() && steps.bundle.outcome == 'success' && steps.bundle_check.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: action-bundle-${{ github.sha }}
          path: dist-action/index.js
          retention-days: 1
      - name: Typecheck the setup UI
        run: npm run typecheck:ui
      - name: Setup UI bundle is up to date
        id: ui_check
        run: npm run check:ui
      - name: Regenerate setup UI for reconciliation
        id: ui_regenerate
        if: failure() && steps.ui_check.outcome == 'failure'
        run: npm run build:ui
      - name: Upload regenerated setup UI for reconciliation
        if: failure() && steps.ui_regenerate.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-ui-${{ github.sha }}
          path: dist-setup
          retention-days: 1
      - name: Dogfood the linter on this repository
        uses: ./
        with:
          command: lint
          args: --format github --fail-on error
