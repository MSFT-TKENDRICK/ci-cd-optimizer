name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.GHCR_IMAGE != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.GHCR_IMAGE != '' }}
          tags: |
            ${{ env.GHCR_IMAGE || 'ci-cd-optimizer' }}:${{ github.sha }}
            ${{ env.GHCR_IMAGE || 'ci-cd-optimizer' }}:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          # Links the GHCR package to this repository so it inherits the repository's access.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
