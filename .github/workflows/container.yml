name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.GHCR_IMAGE != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.GHCR_IMAGE != '' }}
          tags: ${{ env.GHCR_IMAGE != '' && format('{0}:{1}', env.GHCR_IMAGE, github.sha) || format('ci-cd-optimizer:{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
