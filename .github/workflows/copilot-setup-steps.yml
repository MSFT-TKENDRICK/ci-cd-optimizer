name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/setup/**
      - formal/toolchain.json
      - scripts/agent-startup.mjs
      - scripts/formal-toolchain.mjs
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/setup/**
      - formal/toolchain.json
      - scripts/agent-startup.mjs
      - scripts/formal-toolchain.mjs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run formal:setup
      - name: Configure the harness-owned MCP feed without storing credentials
        run: node scripts/agent-startup.mjs --repo "$GITHUB_REPOSITORY" --auth environment --install-hooks
