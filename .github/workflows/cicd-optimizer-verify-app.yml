name: Verify saved CI/CD Optimizer App

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: Expected App ID from setup
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-app-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify selected-repository App access
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify App installation
        run: node scripts/verify-app.mjs
        env:
          EXPECTED_APP_ID: ${{ inputs.app_id }}
          APP_ID: ${{ vars.CICD_OPTIMIZER_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CICD_OPTIMIZER_APP_PRIVATE_KEY }}
