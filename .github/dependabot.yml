version: 2
updates:
  # Bundled into dist-action/: an npm update PR needs `npm run bundle` before CI's freshness check passes.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      # eslint.config.js imports @eslint/js directly; it must move in lockstep with eslint, majors included.
      eslint:
        patterns: ["eslint", "@eslint/js"]
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Types track the Node runtime in .nvmrc (22); bump them with the Node major, not on their own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # gh-aw compiled workflows are regenerated by `gh aw compile`; bump the .md sources and recompile instead.
    exclude-paths:
      - "*.lock.yml"
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "github/gh-aw-actions/*" # managed by `gh aw compile`; never bump in *.lock.yml

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The runtime stage is gcr.io/distroless/nodejs22, which Dependabot can't bump; move Node majors together by hand.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
