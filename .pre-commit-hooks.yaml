# pre-commit hook definitions (https://pre-commit.com). Usage: docs/linter.md#pre-commit.
- id: cicd-lint
  name: ci-cd-optimizer lint
  description: Lint CI/CD workflows, Git hooks, pre-commit configuration, Dockerfiles, and lockfiles.
  # pre-commit installs `language: node` hooks with `npm install -g git+file://…`, which runs only `prepare`, so the
  # TypeScript build in dist/ would be missing. The script runs the committed Action bundle with the system Node.js.
  language: script
  entry: scripts/cicd-lint-hook.mjs
  # Cross-file rules need the whole repository, so the hook lints the repo instead of the staged file list.
  pass_filenames: false
  files: '(^(\.githooks|\.husky)/[^/]+$)|(^\.pre-commit-(config|hooks)\.ya?ml$)|(^|/)(\.github/workflows/[^/]+\.ya?ml|action\.ya?ml|([^/]*\.)?Dockerfile(\.[^/]+)?|Containerfile|package(-lock)?\.json|pnpm-lock\.yaml|yarn\.lock)$'
  require_serial: true
  minimum_pre_commit_version: "3.0.0"
