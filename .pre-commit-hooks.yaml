# pre-commit hook definitions (https://pre-commit.com). Usage: docs/linter.md#pre-commit.
- id: cicd-lint
  name: ci-cd-optimizer lint
  description: Lint GitHub Actions workflows, Dockerfiles, and lockfiles for CI/CD build and release optimizations.
  language: node
  entry: cicd-lint
  # Cross-file rules need the whole repository, so the hook lints the repo instead of the staged file list.
  pass_filenames: false
  files: '(^|/)(\.github/workflows/[^/]+\.ya?ml|action\.ya?ml|([^/]*\.)?Dockerfile(\.[^/]+)?|Containerfile|package(-lock)?\.json|pnpm-lock\.yaml|yarn\.lock)$'
  require_serial: true
  minimum_pre_commit_version: "3.0.0"
